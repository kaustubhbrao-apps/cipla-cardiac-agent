<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cipla Cardiac Opportunity Agent</title>
<link rel="stylesheet" href="theme.css">
<style>
*{box-sizing:border-box}
:root{--bg:var(--clay);--pan:var(--clay);--pan2:var(--clay);--brd:var(--edge);
 --mut:var(--dim);--ac:var(--green);--ac2:var(--green-vivid);
 --warn:var(--amber);--bad:var(--red);--good:var(--green)}

body{margin:0;font-size:14px;line-height:1.5}
header{background:linear-gradient(90deg,#0D2648,#08192F);border-bottom:1px solid var(--brd);
 padding:14px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}
h1{font-size:17px;margin:0;letter-spacing:.4px}
h1 span{color:var(--ac2);font-weight:400}
.kpis{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}
.kpi{text-align:right}.kpi b{display:block;font-size:15px;color:var(--ac2)}
.kpi span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.wrap{display:flex;gap:18px;padding:18px 22px 60px;align-items:flex-start;max-width:1700px;margin:0 auto}
aside{flex:0 0 280px;position:sticky;top:74px}
.card{background:var(--pan);border:1px solid var(--brd);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--ac2)}
label{display:block;font-size:11.5px;color:var(--mut);margin:11px 0 3px;display:flex;justify-content:space-between}
label b{color:var(--ink);font-weight:600}
input[type=range]{width:100%;accent-color:var(--ac);margin:0}
select{width:100%;background:var(--pan2);color:var(--ink);border:1px solid var(--brd);
 border-radius:6px;padding:6px 8px;font-size:12.5px}
button{background:var(--ac);color:#04211f;border:0;border-radius:6px;padding:7px 12px;
 font-weight:700;cursor:pointer;font-size:12px;width:100%;margin-top:10px}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--brd)}
main{flex:1;min-width:0}
.note{background:var(--pan2);border-left:3px solid var(--ac);border-radius:0 8px 8px 0;
 padding:10px 14px;font-size:12.5px;color:var(--mut);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;padding:8px 9px;color:var(--mut);font-size:10.5px;text-transform:uppercase;
 letter-spacing:.7px;border-bottom:1px solid var(--brd);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px;border-bottom:1px solid #1e2531;text-align:right;white-space:nowrap}
tr.row{cursor:pointer}tr.row:hover td{background:var(--pan2)}
tr.sel td{background:#0f2e2e}
.badge{display:inline-block;padding:2px 8px;border-radius:11px;font-size:10.5px;font-weight:700;white-space:nowrap}
.b-pri{background:#0b3b3b;color:#7bd8d8;border:1px solid #1f6b6b}
.b-def{background:#33290b;color:#e8c37d;border:1px solid #6b551f}
.b-opt{background:#12304a;color:#8ec5f0;border:1px solid #1f4d6b}
.b-har{background:#2a2a2a;color:#b9b9b9;border:1px solid #444}
.b-avo{background:#3a1613;color:#f0a29c;border:1px solid #6b2420}
.b-sel{background:#2b1440;color:#c9a2f0;border:1px solid #5a2d80}
.bar{height:5px;background:#233;border-radius:3px;overflow:hidden;min-width:52px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%;background:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mini{font-size:11.5px;color:var(--mut)}
.pill{display:inline-block;background:var(--pan2);border:1px solid var(--brd);border-radius:20px;
 padding:3px 10px;font-size:11px;margin:2px 3px 2px 0}
.up{color:var(--good)}.dn{color:var(--bad)}.flat{color:var(--mut)}
svg text{font-size:10px;fill:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{padding:6px 13px;border-radius:7px;background:var(--pan);border:1px solid var(--brd);
 cursor:pointer;font-size:12.5px;color:var(--mut)}
.tab.on{background:var(--ac);color:#04211f;font-weight:700;border-color:var(--ac)}
@media(max-width:1100px){.wrap{flex-direction:column}aside{position:static;flex:auto;width:100%}
 .grid2{grid-template-columns:1fr}}

/* ── Industrial soft UI — matches the agent page ─────────────────────────── */
body{background:var(--bg);position:relative}
header{background:var(--bg)!important;border-bottom:0!important;
 box-shadow:0 8px 18px var(--hi)}
h1{color:var(--blue)!important;text-shadow:0 1px 0 rgba(255,255,255,.75)}
.card,.tab,table,.kpi{border-radius:16px}
.card{background:var(--pan);box-shadow:var(--out);border:1.5px solid var(--edge);padding:16px 18px}
.card h3{color:var(--blue)}
.kpi b{color:var(--blue)}
.tab{background:none;box-shadow:var(--out-sm);border:1.5px solid var(--edge);color:var(--mut);
 padding:9px 15px;min-height:44px;display:inline-flex;align-items:center;
 transition:all .2s cubic-bezier(.4,0,.2,1)}
.tab:hover{box-shadow:var(--out)}
.tab:active{transform:translateY(2px);box-shadow:var(--in-sm)}
.tab.on{background:var(--ac2);color:#14300A;font-weight:800;border-color:var(--edge)}
th{color:var(--mut);border-bottom:1.5px solid var(--edge)}
td{border-bottom:1px solid rgba(11,20,32,.12)}
tr.row:hover td{background:rgba(11,77,162,.06)}
tr.sel td{background:rgba(141,198,63,.16)}
input[type=range]{accent-color:var(--ac2)}
select,button{border-radius:12px;min-height:44px}
select{background:var(--pan);color:var(--ink);border:1.5px solid var(--edge);box-shadow:var(--in-sm)}
button{background:var(--ac2);color:#14300A;border:1.5px solid var(--edge);font-weight:800;
 box-shadow:var(--out-sm);transition:all .2s cubic-bezier(.4,0,.2,1)}
button:active{transform:translateY(2px);box-shadow:var(--in-sm)}
button.ghost{background:none;color:var(--mut);box-shadow:var(--out-sm)}
.badge{border-radius:11px;font-weight:800;border:1.5px solid var(--edge)}
/* Badges take their ink from the theme tokens, so they stay legible in both.
   Hardcoding a dark green here made PRIORITY invisible on the dark ground. */
.b-pri{background:rgba(141,198,63,.20);color:var(--green)}
.b-def{background:rgba(138,88,0,.16);color:var(--amber)}
.b-opt{background:rgba(11,77,162,.14);color:var(--blue)}
.b-har{background:rgba(109,130,163,.16);color:var(--dim)}
.b-avo{background:rgba(196,36,28,.15);color:var(--red)}
.b-con{background:rgba(11,77,162,.16);color:var(--blue)}
.b-sel{background:rgba(11,77,162,.12);color:var(--blue)}
.up{color:var(--good);font-weight:700}.dn{color:var(--bad);font-weight:700}
.bar{background:rgba(11,20,32,.14);border-radius:4px}
.bar i{background:var(--ac2)}
.note{background:none;border-left:3px solid var(--ac2);box-shadow:var(--in-sm);
 border-radius:0 12px 12px 0;color:var(--mut)}
.pill{border-radius:20px;box-shadow:var(--out-sm);border:1.5px solid var(--edge);background:none}
svg text{fill:var(--mut)}
.loadfail{padding:40px 22px;max-width:60ch}
.loadfail h2{font-family:var(--display);color:var(--red);font-size:19px;margin:0 0 8px}
.loadfail p{font-family:var(--prose);color:var(--dim);line-height:1.6}
.loadfail code{font-family:var(--data);font-size:12px;color:var(--ink)}

/* explanatory note under the ranking — the table cannot answer "why prize and
   not score" on its own, and that is the first thing anyone senior asks */
.readnote{margin-top:22px;padding:16px 18px;border-radius:var(--r-lg);
  box-shadow:var(--in-sm);border:1.5px solid var(--edge);max-width:78ch}
.readnote h4{margin:0 0 8px;font-family:var(--label);font-size:11px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--blue)}
.readnote p{margin:0 0 9px;font-family:var(--prose);font-size:13.5px;line-height:1.62;color:var(--dim)}
.readnote p b{color:var(--ink)}
.readnote .src{font-family:var(--data);font-size:10.5px;letter-spacing:.2px;color:var(--faint);margin:0}

@media (max-width:760px){
 header{padding:11px 14px;gap:10px}
 .wrap{flex-direction:column;padding:14px}
 aside{position:static;width:100%;flex:auto}
 .kpis{gap:10px}
 table{font-size:11.5px}
 th,td{padding:7px 5px}
}

/* range controls: a recessed groove with a raised thumb */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:4px;
 background:var(--pan);box-shadow:var(--in-sm);border:1px solid var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
 width:18px;height:18px;border-radius:50%;background:var(--ac2);border:1.5px solid var(--edge);
 box-shadow:var(--out-sm);margin-top:-7px;cursor:pointer}
input[type=range]:active::-webkit-slider-thumb{box-shadow:var(--in-sm)}
input[type=range]::-moz-range-track{height:7px;border-radius:4px;background:var(--pan);
 box-shadow:var(--in-sm);border:1px solid var(--edge)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;
 background:var(--ac2);border:1.5px solid var(--edge);box-shadow:var(--out-sm);cursor:pointer}

/* type: condensed for stamped labels, mono for figures — matches the agent page */
h1{font-family:var(--label);letter-spacing:.06em}
th,.kpi span,.card h3,.tab,.badge,button,.mini{font-family:var(--label);letter-spacing:.1em}
th{font-size:10.5px;letter-spacing:.13em}
.kpi span{font-size:10px;letter-spacing:.15em}
.card h3{font-size:12.5px;letter-spacing:.16em}
.badge{font-size:11px;letter-spacing:.09em}
td,.kpi b{font-family:var(--data)}
td:first-child{font-family:"Avenir Next",system-ui,sans-serif}
</style></head><body>
<header>
  <button class="btn" id="theme" title="Switch light or dark" aria-label="Switch theme" style="margin-right:10px">◐</button>
<a class="btn" href="/" style="margin-right:16px">&larr; Ask the agent</a><h1>CIPLA CARDIAC OPPORTUNITY AGENT <span>· Ascend Season 4</span></h1>
  <div class="kpis" id="kpis"></div>
</header>
<div class="wrap">
<aside>
  <div class="card">
    <h3>Agent parameters</h3>
    <label>Addressability lock <b id="vLock">70%</b></label>
    <select id="lock"></select>
    <label>Achievable share ceiling <b id="vCeil">8%</b></label>
    <input type="range" id="ceil" min="3" max="14" step="1" value="8">
    <label>Reachable vs leader <b id="vLm">0.60</b></label>
    <input type="range" id="lm" min="30" max="95" step="5" value="60">
    <label>Growth bar (must beat) <b id="vBar">12.2%</b></label>
    <input type="range" id="bar" min="8" max="18" step="0.5" value="12.2">
    <button class="ghost" id="reset">Reset to base case</button>
  </div>
  <div class="card">
    <h3>Pillar weights</h3>
    <label>Market attractiveness <b id="vWa">0.25</b></label>
    <input type="range" id="wa" min="0" max="60" step="5" value="25">
    <label>Future potential <b id="vWf">0.35</b></label>
    <input type="range" id="wf" min="0" max="60" step="5" value="35">
    <label>Competitive intensity <b id="vWc">0.15</b></label>
    <input type="range" id="wc" min="0" max="60" step="5" value="15">
    <label>Strategic fit <b id="vWs">0.25</b></label>
    <input type="range" id="ws" min="0" max="60" step="5" value="25">
    <div class="mini" id="wsum" style="margin-top:8px"></div>
  </div>
  <div class="card"><h3>Recommendation</h3><div id="rec" class="mini"></div></div>
</aside>
<main>
  <div class="tabs">
    <div class="tab on" data-t="rank">Prioritisation</div>
    <div class="tab" data-t="decomp">Growth decomposition</div>
    <div class="tab" data-t="matrix">Opportunity matrix</div>
    <div class="tab" data-t="signals">External signals</div>
  </div>
  <div id="panel"></div>
  <div id="detail"></div>
</main>
</div>
<script>let DATA = null;

/* Aggregated archetype results — 21 KB, no SKU rows. The licensed workbook is
   never deployed; build/build_data.py regenerates this file locally. */
async function boot(){
  try{
    const r = await fetch("data/model.json", {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
  }catch(err){
    document.querySelector(".wrap").innerHTML =
      '<div class="loadfail"><h2>Could not load the model</h2><p>data/model.json did not load ('
      + err.message + '). Run <code>python3 build/build_data.py</code>, then redeploy.</p></div>';
    return;
  }
  start();
}
function start(){
const S = {lock:"0.70", ceil:0.08, lm:0.60, bar:null, w:{a:.25,f:.35,c:.15,s:.25},
           sel:null, tab:"rank", sort:"adj", dir:-1};
const $=q=>document.querySelector(q), fmt=(n,d=0)=>n==null?"–":n.toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=n=>n==null?"flat":n>0.5?"up":n<-0.5?"dn":"flat";

function compute(){
  const L = DATA.locks[S.lock], bar = S.bar==null?DATA.meta.cagr:S.bar;
  const wsum = S.w.a+S.w.f+S.w.c+S.w.s || 1;
  return L.spaces.map(r=>{
    const o = Object.assign({},r);
    o.ceiling = Math.min(S.ceil, (r.leader||0)/100*S.lm);
    o.port = r.n_mol>=5?1:(r.n_mol>=1?0.7:0.4);
    o.mom  = (r.cip_vol!=null&&r.volume!=null&&r.cip_vol>r.volume)?1:((r.cip_vol||0)>0?0.85:0.6);
    o.ach  = (r.cip_sh||0)/100 + Math.max(0,o.ceiling-(r.cip_sh||0)/100)*o.port*o.mom;
    o.prize= Math.max(0, o.ach*r.m26 - (r.cip||0));
    o.prizePct = o.prize/DATA.meta.cipla*100;
    o.premium = Math.max(-6,(r.value||0)-bar);
    o.adj  = o.prize*(1+o.premium/20);
    o.score= (S.w.a*r.P_attract + S.w.f*r.P_future + S.w.c*r.P_compete + S.w.s*r.P_fit)/wsum;
    o.beats= (r.value||0) > bar;
    // ── MIRRORS CardiacAgent.prize().call() IN cipla_cardiac_agent.py ──────────
    // Duplicated deliberately so the sliders recompute without a server round
    // trip. It drifted once (this branch still said HARVEST after the Python
    // side moved to CONVERT), so parityCheck() below now verifies the two agree
    // at base case on every load. If you change one, change both.
    o.call = !o.beats
           ? (((r.cip_sh||0)>2 && (r.cip_vol||0)<0 && (r.cip_vol||0)<(r.volume||0))
                ? "CONVERT"
                : ((r.cip_sh||0)>2 ? "HARVEST" : "AVOID"))
           : (o.prize>40 && r.leader<25) ? "PRIORITY"
           : (r.cip_sh>4) ? "DEFEND" : (o.prize>40 ? "SELECTIVE" : "OPTION");
    return o;
  });
}
const BADGE={PRIORITY:"b-pri",CONVERT:"b-con",DEFEND:"b-def",OPTION:"b-opt",HARVEST:"b-har",AVOID:"b-avo",SELECTIVE:"b-sel"};

function kpis(){
  const m=DATA.meta, L=DATA.locks[S.lock];
  $("#kpis").innerHTML=[
    [fmt(m.market)+" Cr","cardiac market"],
    [m.cagr.toFixed(1)+"%","market CAGR"],
    [m.vol.toFixed(1)+"% / "+m.mix.toFixed(1)+"%","volume / mix"],
    [fmt(m.cipla)+" Cr","Cipla ("+m.ciplaShare.toFixed(2)+"%, #"+m.rank+")"],
    [fmt(L.lockedPct,1)+"%","locked out"]
  ].map(k=>`<div class="kpi"><b>${k[0]}</b><span>${k[1]}</span></div>`).join("");
}

function rankTable(rows){
  const cols=[["space","Opportunity space"],["m26","Pool ₹Cr"],["value","CAGR"],["volume","Volume"],
    ["leader","Leader%"],["cip_sh","Cipla%"],["ach","Achv%"],["prize","Prize ₹Cr"],
    ["adj","Adj prize"],["score","Score"],["call","Call"]];
  const mx=Math.max(...rows.map(r=>r.adj||0),1);
  return `<table><thead><tr>${cols.map(c=>`<th data-s="${c[0]}">${c[1]}</th>`).join("")}</tr></thead><tbody>
  ${rows.map(r=>`<tr class="row ${S.sel===r.key?'sel':''}" data-k="${r.key}">
    <td><b>${r.key}</b> ${DATA.labels[r.key]||r.space}</td>
    <td>${fmt(r.m26)}</td>
    <td class="${sgn((r.value||0)-DATA.meta.cagr)}">${fmt(r.value,1)}%</td>
    <td class="${sgn((r.volume||0)-DATA.meta.vol)}">${fmt(r.volume,1)}%</td>
    <td>${fmt(r.leader,1)}</td><td>${fmt(r.cip_sh,2)}</td><td>${fmt(r.ach*100,1)}</td>
    <td><b>${fmt(r.prize)}</b></td>
    <td><span class="bar" style="width:60px"><i style="width:${Math.max(2,r.adj/mx*100)}%"></i></span> ${fmt(r.adj)}</td>
    <td>${fmt(r.score,1)}</td>
    <td><span class="badge ${BADGE[r.call]}">${r.call}</span></td></tr>`).join("")}
  </tbody></table>
  <div class="readnote">
    <h4>Reading this table</h4>
    <p><b>Prize and Score answer different questions, and where they disagree we follow Prize.</b>
       Score is how attractive a space is. Prize is what Cipla can realistically take out of it.
       <b>A8</b> carries the largest prize on the board, but 8.3 of its 10.3 growth points are mix —
       the same patients paying more — so it funds the plan rather than receiving it.</p>
    <p><b>A4 is the one place our model and our judgement differ, and we would rather show it than
       bury it.</b> It scores second highest because it grows fastest, yet its prize is only ₹19 Cr:
       our sizing holds every pool flat at MAT Feb'26 and treats pool growth as uncounted upside,
       which penalises the fastest-growing space hardest. Grown at even 20% a year it is about
       ₹49 Cr. We still exclude it from what we underwrite, deliberately, to keep that number
       conservative.</p>
    <p class="src">Every figure recomputed live from 7,452 SKU records. Move any control on the left
       and the whole table re-derives — nothing here is typed in.</p>
  </div>`;
}

function decompPanel(rows){
  const mx=Math.max(...rows.map(r=>Math.abs(r.value||0)),1);
  return `<div class="note">Value growth = <b>volume</b> (more patients) + <b>mix</b> (upgrading to
  costlier combinations) + <b>price</b>. Only volume is durable over 3–5 years. Market-wide,
  just ${DATA.meta.vol.toFixed(1)} of ${DATA.meta.cagr.toFixed(1)} points is volume —
  <b>${Math.round(DATA.meta.mix/DATA.meta.cagr*100)}% of cardiac growth is patients upgrading, not new patients.</b></div>
  <table><thead><tr><th>Opportunity space</th><th>Pool ₹Cr</th><th>Value</th><th>Volume</th>
  <th>Mix</th><th>Price</th><th style="text-align:left;padding-left:16px">Composition</th><th>Read</th></tr></thead><tbody>
  ${rows.map(r=>{const w=x=>Math.max(0,(x||0))/mx*100;
    const read=(r.volume>8)?"volume-led — durable":(r.volume>4)?"volume-supported":
               (r.volume>0)?"mix-led — will saturate":"VOLUME DECLINING";
    return `<tr class="row" data-k="${r.key}"><td><b>${r.key}</b> ${DATA.labels[r.key]}</td>
    <td>${fmt(r.m26)}</td><td>${fmt(r.value,1)}%</td>
    <td class="${sgn(r.volume)}">${fmt(r.volume,1)}%</td><td>${fmt(r.mix,1)}%</td>
    <td class="${sgn(r.price)}">${fmt(r.price,1)}%</td>
    <td style="text-align:left;padding-left:16px"><span class="bar" style="width:150px">
      <i style="width:${w(r.volume)}%;background:#3fb950;float:left"></i>
      <i style="width:${w(r.mix)}%;background:#e8a33d;float:left"></i>
      <i style="width:${w(r.price)}%;background:#8ec5f0;float:left"></i></span></td>
    <td style="text-align:left">${read}</td></tr>`}).join("")}</tbody></table>
    <div class="mini" style="margin-top:8px">
      <span class="pill"><span style="color:#3fb950">■</span> volume</span>
      <span class="pill"><span style="color:#e8a33d">■</span> mix</span>
      <span class="pill"><span style="color:#8ec5f0">■</span> price</span></div>`;
}

function matrixPanel(rows){
  const W=760,H=430,pad=52;
  const xs=rows.map(r=>r.score), ys=rows.map(r=>r.P_fit);
  const x0=Math.min(...xs)-4,x1=Math.max(...xs)+4,y0=Math.min(...ys)-6,y1=Math.max(...ys)+6;
  const X=v=>pad+(v-x0)/(x1-x0)*(W-pad*1.4), Y=v=>H-pad-(v-y0)/(y1-y0)*(H-pad*1.6);
  const mx=Math.max(...rows.map(r=>r.prize||0),1);
  const mxs=(x0+x1)/2, mys=(y0+y1)/2;
  return `<div class="note">Composite <b>score</b> (attractiveness + future + competition, weighted) against
  <b>right to win</b> (strategic fit pillar). Bubble area = prize Cipla can realistically win.
  Top-right is where to invest; bottom-right is a strong position in a weak pool.</div>
  <svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--pan);border:1px solid var(--brd);border-radius:10px">
  <line x1="${X(mxs)}" y1="${pad-14}" x2="${X(mxs)}" y2="${H-pad}" stroke="#2a3242" stroke-dasharray="4 4"/>
  <line x1="${pad-10}" y1="${Y(mys)}" x2="${W-16}" y2="${Y(mys)}" stroke="#2a3242" stroke-dasharray="4 4"/>
  <text x="${W-20}" y="${Y(mys)-8}" text-anchor="end">higher opportunity →</text>
  <text x="${pad-14}" y="${pad-20}" >↑ stronger right to win</text>
  ${rows.map(r=>{const rad=6+Math.sqrt((r.prize||0)/mx)*24;
    return `<g class="row" data-k="${r.key}" style="cursor:pointer">
      <circle cx="${X(r.score)}" cy="${Y(r.P_fit)}" r="${rad}"
        fill="${r.call==='PRIORITY'?'var(--green-vivid)':r.call==='CONVERT'?'var(--blue)':r.call==='DEFEND'?'var(--amber)':r.call==='AVOID'?'var(--red)':'var(--faint)'}"
        fill-opacity=".45" stroke="${S.sel===r.key?'#7bd8d8':'#0d1117'}" stroke-width="${S.sel===r.key?3:1.5}"/>
      <text x="${X(r.score)}" y="${Y(r.P_fit)+4}" text-anchor="middle" fill="#e6edf3" font-weight="700">${r.key}</text>
    </g>`}).join("")}
  <text x="${W/2}" y="${H-12}" text-anchor="middle">composite opportunity score →</text></svg>`;
}

function signalsPanel(){
  return `<div class="note">External signals adjust the <b>future potential</b> pillar. Every signal is
  sourced and auditable — this is the register behind the appendix requirement.</div>
  ${DATA.signals.map(s=>`<div class="card" style="margin-bottom:10px">
    <div><span class="badge ${s.delta>0?'b-pri':'b-avo'}">${s.delta>0?'+':''}${s.delta}</span>
    <b style="margin-left:8px">${s.name}</b></div>
    <div class="mini" style="margin-top:6px">applies to <code>/${s.pat}/</code></div>
    <div class="mini">source: ${s.src}</div></div>`).join("")}`;
}

function detailPanel(rows){
  if(!S.sel) return "";

  const co=DATA.comp[S.sel]||[], ml=DATA.mols[S.sel]||[];
  const sig=DATA.signals.filter(s=>new RegExp(s.pat,"i").test(r.space));
  return `<div class="card" style="margin-top:16px">
   <h3>${r.key} · ${DATA.labels[r.key]}</h3>
   <div class="grid2">
    <div>
      <div class="mini">Pool <b style="color:var(--ink)">₹${fmt(r.m26)} Cr</b> ·
        growth <b style="color:var(--ink)">${fmt(r.value,1)}%</b>
        = volume ${fmt(r.volume,1)} + mix ${fmt(r.mix,1)} + price ${fmt(r.price,1)}</div>
      <div class="mini">HHI ${fmt(r.hhi)} · leader ${fmt(r.leader,1)}% · top-3 ${fmt(r.top3,1)}% · ${r.n_co} companies</div>
      <div class="mini">Cipla ₹${fmt(r.cip,1)} Cr = ${fmt(r.cip_sh,2)}% · ${r.n_mol} molecules, ${r.n_cbrand} brands</div>
      <div class="mini">Cipla volume ${fmt(r.cip_vol,1)}% vs market ${fmt(r.volume,1)}% →
        <b class="${r.cip_vol>r.volume?'up':'dn'}">${r.cip_vol>r.volume?'OUTGROWING':'lagging'}</b></div>
      <div style="margin-top:8px">
        <span class="pill">attract ${fmt(r.P_attract)}</span><span class="pill">future ${fmt(r.P_future)}</span>
        <span class="pill">compete ${fmt(r.P_compete)}</span><span class="pill">fit ${fmt(r.P_fit)}</span></div>
      <div class="mini" style="margin-top:8px">achievable ${fmt(r.ach*100,1)}%
        = ceiling ${fmt(r.ceiling*100,1)}% × portfolio ${r.port.toFixed(2)} × momentum ${r.mom.toFixed(2)}</div>
      <div style="margin-top:8px;font-size:15px"><b style="color:var(--ac2)">PRIZE ₹${fmt(r.prize)} Cr</b>
        <span class="mini">= ${fmt(r.prizePct)}% of Cipla cardiac</span>
        <span class="badge ${BADGE[r.call]}" style="margin-left:8px">${r.call}</span></div>
      ${sig.length?`<div class="mini" style="margin-top:8px">signals: ${sig.map(s=>
        `<span class="pill">${s.delta>0?'+':''}${s.delta} ${s.name.slice(0,44)}…</span>`).join("")}</div>`:""}
    </div>
    <div>
      <div class="mini" style="margin-bottom:5px"><b>Competitors</b></div>
      <table style="font-size:11.5px"><tbody>
      ${co.map(c=>`<tr><td style="text-align:left${c.isCipla?';color:var(--ac2);font-weight:700':''}">${c.name}</td>
        <td>${fmt(c.sh,1)}%</td><td class="${sgn(c.mom)}">${c.mom>0?'+':''}${fmt(c.mom,1)}</td>
        <td class="mini">${c.mo}mol</td>
        <td class="mini" style="text-align:left">${c.mom>3&&c.vol>5?'gaining on demand':c.mom>3?'gaining on mix':c.mom>-3?'holding':'losing share'}${c.dep>70?'; 1-brand':''}</td></tr>`).join("")}
      </tbody></table>
      <div class="mini" style="margin:10px 0 5px"><b>Top molecules</b></div>
      <table style="font-size:11.5px"><tbody>
      ${ml.map(m=>`<tr><td style="text-align:left">${m.name}</td><td>₹${fmt(m.v)}</td>
        <td class="${sgn((m.cagr||0)-DATA.meta.cagr)}">${fmt(m.cagr,1)}%</td>
        <td class="mini">Cipla ${fmt(m.cip,2)}%</td></tr>`).join("")}
      </tbody></table>
    </div></div></div>`;
}

function recPanel(rows){
  const pri=rows.filter(r=>r.call==="PRIORITY");
  if(!pri.length) return `<span class="mini">No space clears the bar at these settings.</span>`;
  const tot=pri.reduce((s,r)=>s+r.prize,0);
  return pri.map(r=>`<div style="margin-bottom:9px">
    <b style="color:var(--ac2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.key} · ${DATA.labels[r.key]}</b>
    <span class="mini">₹${fmt(r.m26)} Cr @ ${fmt(r.value,1)}% · leader ${fmt(r.leader,1)}% ·
    prize <b style="color:var(--ink)">₹${fmt(r.prize)} Cr</b></span></div>`).join("")
    + `<div style="border-top:1px solid var(--brd);padding-top:8px;margin-top:6px">
       Combined <b style="color:var(--ac2)">₹${fmt(tot)} Cr</b>
       <span class="mini">on a ₹${fmt(DATA.meta.cipla)} Cr base (+${Math.round(tot/DATA.meta.cipla*100)}%)</span></div>`;
}

function render(){
  let rows=compute();
  const k=S.sort;
  rows.sort((a,b)=>{const va=k==="space"?a.key:(a[k]??-1e9), vb=k==="space"?b.key:(b[k]??-1e9);
    return (va>vb?1:va<vb?-1:0)*S.dir});
  kpis();
  $("#panel").innerHTML = S.tab==="rank"?rankTable(rows):S.tab==="decomp"?decompPanel(rows)
    :S.tab==="matrix"?matrixPanel(rows):signalsPanel();
  $("#detail").innerHTML = S.tab==="signals"?"":detailPanel(rows);
  $("#rec").innerHTML = recPanel(rows);
  document.querySelectorAll("[data-k]").forEach(el=>el.onclick=()=>{
    S.sel = S.sel===el.dataset.k?null:el.dataset.k; render();});
  document.querySelectorAll("th[data-s]").forEach(th=>th.onclick=()=>{
    if(S.sort===th.dataset.s) S.dir*=-1; else {S.sort=th.dataset.s; S.dir=-1;} render();});
}

// ---- controls ----
const lockSel=$("#lock");
Object.keys(DATA.locks).sort().forEach(k=>{
  const o=document.createElement("option"); o.value=k;
  o.textContent = parseFloat(k)>1 ? "no filter" : "rival >"+Math.round(parseFloat(k)*100)+"% locked out";
  if(k==="0.70") o.selected=true; lockSel.appendChild(o);});
lockSel.onchange=e=>{S.lock=e.target.value;
  $("#vLock").textContent = parseFloat(S.lock)>1?"off":Math.round(parseFloat(S.lock)*100)+"%"; render();};
const bind=(id,lbl,fn,fmtf)=>{$(id).oninput=e=>{fn(+e.target.value);$(lbl).textContent=fmtf(+e.target.value);render();}};
bind("#ceil","#vCeil",v=>S.ceil=v/100,v=>v+"%");
bind("#lm","#vLm",v=>S.lm=v/100,v=>(v/100).toFixed(2));
bind("#bar","#vBar",v=>S.bar=v,v=>v.toFixed(1)+"%");
["a","f","c","s"].forEach((k,i)=>{const ids=["#wa","#wf","#wc","#ws"],lbs=["#vWa","#vWf","#vWc","#vWs"];
  $(ids[i]).oninput=e=>{S.w[k]=+e.target.value/100;$(lbs[i]).textContent=(+e.target.value/100).toFixed(2);
    $("#wsum").textContent="sum "+(S.w.a+S.w.f+S.w.c+S.w.s).toFixed(2)+" (normalised)";render();};});
$("#reset").onclick=()=>{S.ceil=.08;S.lm=.6;S.bar=null;S.w={a:.25,f:.35,c:.15,s:.25};S.lock="0.70";
  $("#ceil").value=8;$("#lm").value=60;$("#bar").value=DATA.meta.cagr;lockSel.value="0.70";
  $("#wa").value=25;$("#wf").value=35;$("#wc").value=15;$("#ws").value=25;
  $("#vCeil").textContent="8%";$("#vLm").textContent="0.60";$("#vBar").textContent=DATA.meta.cagr.toFixed(1)+"%";
  $("#vLock").textContent="70%";$("#vWa").textContent="0.25";$("#vWf").textContent="0.35";
  $("#vWc").textContent="0.15";$("#vWs").textContent="0.25";render();};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); S.tab=t.dataset.t; render();});
$("#bar").value=DATA.meta.cagr; $("#vBar").textContent=DATA.meta.cagr.toFixed(1)+"%";
render();

/* ── PARITY CHECK ───────────────────────────────────────────────────────────
   compute() above is a JavaScript mirror of the Python engine so the sliders
   respond instantly. A mirror can drift, and once did. On load, at base-case
   parameters, ask the engine what IT returns and compare every call. Any
   disagreement is shown in the header — silent drift is the failure mode that
   matters, because the numbers still look plausible when they are wrong.      */
(async function parityCheck(){
  try{
    const res = await fetch("/api/rank");            // present only when the local Python engine is running
    if(!res.ok) return;                              // offline demo: skip quietly
    const server = await res.json();
    const mine = {}; compute().forEach(r => mine[r.space ? r.space.slice(0,2) : r.key] = r.call);
    const bad = server.filter(r => mine[r.key] && !r.call.startsWith(mine[r.key]));
    if(bad.length){
      const el = document.createElement("div");
      el.style.cssText = "position:fixed;bottom:14px;right:14px;z-index:99;max-width:340px;"
        + "background:var(--clay);border:1.5px solid var(--red);border-radius:var(--r-md);"
        + "box-shadow:var(--out);padding:10px 13px;font-size:12px;color:var(--red)";
      el.textContent = "Engine disagrees with this view on: "
        + bad.map(r => r.key + " (engine " + r.call.split(" ")[0] + ", shown " + mine[r.key] + ")").join(", ");
      document.body.appendChild(el);
      console.warn("PARITY FAIL", bad.map(r => [r.key, r.call, mine[r.key]]));
    } else { console.info("parity OK — view matches engine on all " + server.length + " calls"); }
  }catch(e){ /* never let a check break the demo */ }
})();

}
boot();

/* Theme: follow the OS until the user chooses, then remember it — same key as
   the agent page, so a choice made on either carries to both. */
(function(){
  const root=document.documentElement, KEY="cipla-theme";
  const saved=localStorage.getItem(KEY); if(saved) root.dataset.theme=saved;
  const b=document.getElementById("theme"); if(!b) return;
  b.onclick=()=>{
    const dark=matchMedia("(prefers-color-scheme: dark)").matches;
    const now=root.dataset.theme || (dark?"dark":"light");
    const next=now==="dark"?"light":"dark";
    root.dataset.theme=next; localStorage.setItem(KEY,next);
  };
})();
</script>
